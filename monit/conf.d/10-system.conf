# monit/conf.d/10-system.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Alert-only virtual-machine resource floor. Service restart ownership remains
# with systemd and deployment-specific policy.

check system $HOST
    if loadavg (1min) per core > 4 for 5 cycles then alert
    if loadavg (5min) per core > 2 for 10 cycles then alert
    if cpu usage > 95% for 10 cycles then alert
    if memory usage > 90% for 5 cycles then alert
    if swap usage > 50% for 5 cycles then alert

check filesystem root_filesystem with path /
    if space usage > 85% for 3 cycles then alert
    if inode usage > 85% for 3 cycles then alert
