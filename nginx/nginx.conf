# nginx.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

user nginx nginx;
worker_processes auto;

quic_bpf on;

# Load the dynamic Brotli modules from GetPageSpeed
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

pid /var/run/nginx/nginx.pid;
lock_file /var/run/lock/nginx/nginx.lock;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

worker_rlimit_nofile 100000;

http {
    include mime.types;

    # RFC 9239 type; nginx ships this mapping only from 1.25.4 on.
    # Declared here so a package upgrade that rewrites mime.types can't drop it.
    types {
        text/javascript  mjs;
    }

    default_type application/octet-stream;

    client_body_temp_path /var/lib/nginx/client_tmp;
    proxy_temp_path /var/lib/nginx/proxy_tmp;

    # SSL
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_ecdh_curve X25519MLKEM768:X25519:secp256r1;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Options PrioritizeChaCha;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # OCSP stapling RIP May 2025
    ssl_stapling off;

    # Full Server Identity Hiding
    server_tokens off;

    # Enables sendfile()
    sendfile on;
    sendfile_max_chunk 2m;
    client_max_body_size 128M;

    # Optimise internal TCP connections
    tcp_nopush on;
    tcp_nodelay on;

    # For proxying to node.js
    keepalive_timeout 30;

    # Allow the server to close connection on non responding client, this will free up memory
    reset_timedout_connection on;

    # Request timed out -- default 60
    client_body_timeout 12;
    client_header_timeout 12;

    # if client stop responding, free up memory -- default 60
    send_timeout 30;

    # File handle caching
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Why isn't this the default?
    charset utf-8;

    # Security?
    include includes/security-headers.conf;

    # Load the installer-selected http-level feature fragments.
    include stubs/*.conf;
    include upstreams/*.conf;
    include sites/*.conf;
}
