# nginx.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Load installer-selected main-context feature fragments.
include stubs/*.conf;

user nginx nginx;
worker_processes auto;

pid /var/run/nginx/nginx.pid;
lock_file /var/run/lock/nginx/nginx.lock;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

worker_rlimit_nofile 100000;

http {
    include mime.types;

    # RFC 9239 type; nginx ships this mapping only from 1.25.4 on.
    # Declared here so a package upgrade that rewrites mime.types can't drop it.
    types {
        text/javascript  mjs;
    }

    default_type application/octet-stream;

    client_body_temp_path /var/lib/nginx/client_tmp;
    fastcgi_temp_path /var/lib/nginx/fastcgi_tmp;
    proxy_temp_path /var/lib/nginx/proxy_tmp;

    access_log /var/log/nginx/access.log combined;

    # Full Server Identity Hiding
    server_tokens off;

    # Enables sendfile()
    sendfile on;
    sendfile_max_chunk 2m;
    # Conservative default; raise per site or location where uploads need it.
    client_max_body_size 16M;

    # Optimise internal TCP connections
    tcp_nopush on;
    tcp_nodelay on;

    # For proxying to node.js
    keepalive_timeout 30;

    # Allow the server to close connection on non responding client, this will free up memory
    reset_timedout_connection on;

    # Request timed out -- default 60
    client_body_timeout 12;
    client_header_timeout 12;

    # if client stop responding, free up memory -- default 60
    send_timeout 30;

    # File handle caching
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Why isn't this the default?
    charset utf-8;

    # Security?
    include includes/security-headers.conf;

    # Load the installer-selected http-context feature fragments.
    include stubs/http/*.conf;
    include upstreams/*.conf;
    include sites/*.conf;
}
