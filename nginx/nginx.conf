# nginx.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Load installer-selected main-context feature fragments.
include stubs/*.conf;

user nginx nginx;
worker_processes auto;

pid /var/run/nginx/nginx.pid;
lock_file /var/run/lock/nginx/nginx.lock;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    use epoll;
}

worker_rlimit_nofile 100000;

http {
    include mime.types;

    # RFC 9239 type. The stock nginx mime.types file does not map .mjs, so keep
    # this here where a package upgrade cannot overwrite it.
    types {
        text/javascript  mjs;
    }

    default_type application/octet-stream;

    client_body_temp_path /var/lib/nginx/client_tmp;
    fastcgi_temp_path /var/lib/nginx/fastcgi_tmp;
    proxy_temp_path /var/lib/nginx/proxy_tmp;

    # One JSON object per request. $request_id correlates a request across
    # access log, error log context, and upstream applications; the timing,
    # cache, and TLS fields make latency, hit-rate, and protocol adoption
    # measurable without changing the format later. Numeric fields that nginx
    # can render empty stay quoted so every line remains valid JSON.
    log_format main escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"host":"$host",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"server_protocol":"$server_protocol",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_cache_status":"$upstream_cache_status"'
        '}';

    # Buffered writes trade at most five seconds of log latency for far fewer
    # write syscalls under load. Workers flush on graceful shutdown and reopen.
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    # Hide the nginx version in generated responses, including Server headers.
    server_tokens off;

    # Enable efficient file transmission.
    sendfile on;
    sendfile_max_chunk 2m;

    # Files past the directio threshold bypass the page cache and are read on
    # the worker thread pool so one large download cannot stall an event loop;
    # sendfile continues to serve everything smaller. Requires --with-threads.
    aio threads;
    directio 4m;
    # Conservative default; raise per site or location where uploads need it.
    client_max_body_size 16M;

    # Optimize TCP packet handling.
    tcp_nopush on;
    tcp_nodelay on;

    # Keep proxied application connections reasonably short-lived.
    keepalive_timeout 30;

    # Close connections from unresponsive clients promptly.
    reset_timedout_connection on;

    client_body_timeout 12;
    client_header_timeout 12;

    send_timeout 30;

    # File handle caching
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Default charset for text responses that do not declare one.
    charset utf-8;

    # HTTP versions for every server. TLS listeners negotiate h2 via ALPN and
    # cleartext listeners stay HTTP/1.1; HTTP/3 additionally requires the
    # site's quic listener and Alt-Svc advertisement.
    http2 on;
    http3 on;

    # Shared security-header policy and upstream-aware fallbacks.
    include includes/security-headers.conf;

    # Load the installer-selected http-context feature fragments.
    include stubs/http/*.conf;
    include upstreams/*.conf;
    include sites/*.conf;
}
