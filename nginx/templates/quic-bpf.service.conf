# Optional, repository-managed nginx QUIC BPF capability extension.
# Install only with the reviewed quic_bpf profile. systemd merges this positive
# capability assignment with the base unit's positive assignment. The base
# @mount denial remains mandatory, including on kernels needing SYS_ADMIN.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_SYS_ADMIN CAP_BPF CAP_PERFMON
Environment=NGINX_QUIC_BPF=yes
