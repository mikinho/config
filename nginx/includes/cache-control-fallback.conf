# includes/cache-control-fallback.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional http {}-level map for Node.js applications that serve some files
# directly from nginx and proxy other responses to the application.
#
# The application must define $static_cache_control before including this file.
# For an nginx-served response, $upstream_addr is empty and the application's
# static policy is emitted. For a proxied response, this value is empty so the
# application can supply Cache-Control without a duplicate nginx header.
#
# This file is deliberately not loaded by nginx.conf. Include it exactly once
# from a participating application's http {}-level configuration. Hosts with
# no such application therefore never reference $static_cache_control and can
# pass nginx -t without defining it.
map $upstream_addr $cache_control_fallback {
    ""      $static_cache_control;
    default "";
}
