# nginx/includes/block-cgi.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Server-context only. Opt in only for a site that never exposes CGI or
# directly addressable Perl, Python, or shell scripts. Reject both the
# conventional CGI namespace and executable-script suffix probes.
location ~* ^/cgi-bin(?:/|$) {
    access_log off;
    log_not_found off;
    return 444;
}

location ~* \.(?:cgi|pl|py|sh)(?:/|$) {
    access_log off;
    log_not_found off;
    return 444;
}
