# nginx/includes/quiet-common-requests.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Root-based sites only. These bare locations serve from the enclosing
# server's filesystem root; a reverse-proxy site has no root here, so
# including this file would hand these paths to nginx's compiled-in default
# root instead of the application. Proxy sites that want the same quiet
# logging must declare their own locations around proxy_pass.

location = /favicon.ico {
    log_not_found off;
    access_log off;
}

location = /robots.txt {
    # Successful requests stay quiet, but a missing or failing robots policy is
    # operational and SEO evidence worth retaining.
    access_log /var/log/nginx/static-asset-failures.log main buffer=32k flush=5s if=$log_static_asset_failure;
    log_not_found off;
}
