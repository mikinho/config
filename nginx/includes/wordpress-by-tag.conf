# includes/wordpress-by-tag.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Safe default WordPress routing. Shared page caching is deliberately absent:
# a site must select includes/wordpress-cache-by-tag.conf instead, add the
# wordpress-cache deployment profile, and validate its complete cookie and
# personalization contract before enabling an edge cache.
include includes/wordpress-common-by-tag.conf;

location ~ \.php$ {
    limit_req zone=req_general burst=30 nodelay;

    include includes/php-fpm-by-tag.conf;
}
