# nginx/includes/wordpress-cache.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

fastcgi_cache wp;
fastcgi_cache_valid 200 301 302 10s;
fastcgi_cache_valid 404 1m;

fastcgi_cache_bypass $wp_has_cookie $wp_has_authorization $wp_has_query $wp_nocache_uri $wp_nocache_method;
fastcgi_no_cache $wp_has_cookie $wp_has_authorization $wp_has_query $wp_nocache_uri $wp_nocache_method;

fastcgi_cache_lock on;
fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;
fastcgi_cache_background_update on;
fastcgi_cache_revalidate on;

# Keep nginx's safe response-header behavior: Cache-Control, Expires,
# Set-Cookie, and Vary can prevent or constrain caching. A site must not ignore
# those application signals without a separate, reviewed policy.
