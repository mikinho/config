# includes/wordpress-common-by-tag.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Shared server-level WordPress routes. Include this only through exactly one
# of wordpress-by-tag.conf or wordpress-cache-by-tag.conf.
limit_conn conn_general 20;

error_page 502 503 504 /maintenance.html;

# Enable WordPress permanent links.
location / {
    try_files $uri $uri/ /index.php?$args;
}

location = /wp-login.php {
    limit_req zone=req_auth burst=5 nodelay;

    include includes/php-fpm-by-tag.conf;
}

# XML-RPC is a brute force and pingback amplification vector.
location = /xmlrpc.php {
    deny all;
}

# Deny the live configuration and common editor or backup variants.
location ~* ^/wp-config\.php(?:$|[._~-]) {
    deny all;
}

location = /readme.html {
    deny all;
}

location = /license.txt {
    deny all;
}

# Uploaded content must never become executable or active same-origin content.
# The suffix boundary also catches double extensions such as file.php.jpg.
location ~* ^/wp-content/uploads/.*\.(?:cgi|pl|py|sh|html?|shtml?|xhtml|phtml|php[0-9]*|phar|phps|js|mjs|cjs|svgz?|swf)(?:[./]|$) {
    deny all;
}

location ~* ^/wp-content/debug\.log$ {
    deny all;
}

# Admin requests are never cached. The baseline keeps browser-driven PHP under
# the shared 60-second FPM hard cap. Run longer maintenance through WP-CLI or a
# background worker, or provide paired site-specific nginx and FPM overrides.
location ~ ^/wp-admin/.*\.php$ {
    limit_req zone=req_general burst=30 nodelay;

    include includes/php-fpm-by-tag.conf;
}

# Static assets dominate request volume and carry no security or analytics
# signal worth a log write each; PHP requests remain fully logged.
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
    expires 1y;
    access_log off;
    log_not_found off;
}
