# nginx/includes/relativeurls.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Legacy, site-specific opt-in only. This response-body filter rewrites every
# matching src, srcset, and href attribute, including canonical and hreflang
# links. Do not include it from a shared WordPress/PHP path or use it as a
# substitute for correct application URL generation on an SEO-indexed site.

sub_filter_once off;
sub_filter 'src="http://$host/' 'src="/';
sub_filter 'src="https://$host/' 'src="/';
sub_filter "src='http://$host/" "src='/";
sub_filter "src='https://$host/" "src='/";
sub_filter 'srcset="http://$host/' 'srcset="/';
sub_filter 'srcset="https://$host/' 'srcset="/';
sub_filter "srcset='http://$host/" "srcset='/";
sub_filter "srcset='https://$host/" "srcset='/";
sub_filter 'href="http://$host/' 'href="/';
sub_filter 'href="https://$host/' 'href="/';
sub_filter "href='http://$host/" "href='/";
sub_filter "href='https://$host/" "href='/";
