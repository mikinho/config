# nginx/includes/wordpress-cache-by-tag.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional WordPress routing with a conservative shared FastCGI page cache.
# Requires the wordpress-cache deployment profile. Every request carrying a
# Cookie, Authorization header, or query string bypasses this cache; a site may
# replace those broad rules only after auditing all authentication,
# personalization, commerce, consent, and parameter-driven response state.
include includes/wordpress-common-by-tag.conf;

location ~ \.php$ {
    limit_req zone=req_general burst=30 nodelay;

    include includes/php-fpm-by-tag.conf;
    include includes/wordpress-cache.conf;
}
