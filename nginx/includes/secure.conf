# Prevent access to hidden files. Answering 404 rather than 403 keeps a probe
# from confirming that a denied path exists.
location ~* /\.(?!well-known\/) {
    return 404;
}

# Prevent access to operational file extensions and common editor, backup,
# and packaging leftovers.
location ~* \.(ini|log|conf|bak|sql|old|orig|save|swp|dist)$ {
    return 404;
}
