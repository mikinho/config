# includes/block-wordpress-probes.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Server-context only. Opt in only for a site that does not run WordPress.
# Keep this separate from block-php.conf so a non-WordPress PHP application
# can reject WordPress scans without disabling its own PHP routes.
location ~* ^/(?:wp-admin|wp-content|wp-includes|wp-json)(?:/|$) {
    access_log off;
    log_not_found off;
    return 444;
}

location ~* ^/(?:wp-login|xmlrpc)\.php(?:/|$) {
    access_log off;
    log_not_found off;
    return 444;
}
