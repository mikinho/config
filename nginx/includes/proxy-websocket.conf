# includes/proxy-websocket.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# WebSocket variant of includes/proxy-common.conf; use one or the other in a
# location, never both. Requires the websocket profile's $connection_upgrade
# map. Kept self-contained because nginx emits duplicate headers when the
# same proxy_set_header name is set twice at one level.
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# This nginx host is an edge server directly exposed to the public internet.
# Never append a client-supplied X-Forwarded-For chain here: overwrite it with
# nginx's validated $remote_addr to prevent application-level IP spoofing. If
# the trusted-proxy profile is selected later, the real-IP module first updates
# $remote_addr from only explicitly trusted peers, so this remains correct.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;

# An idle WebSocket closes at this interval unless the application sends
# protocol-level pings. Raise it only for endpoints that genuinely idle.
proxy_read_timeout 300s;
