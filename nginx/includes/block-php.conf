# nginx/includes/block-php.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Server-context only. Opt in only for a site with no PHP runtime. Dropping
# these requests at nginx keeps generic PHP exploit scans out of application
# logs and avoids spending upstream resources on traffic the site cannot serve.
location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) {
    access_log off;
    log_not_found off;
    return 444;
}
