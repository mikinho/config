# includes/php-fpm-by-tag.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

try_files $fastcgi_script_name =404;

fastcgi_intercept_errors on;
fastcgi_index index.php;

include fastcgi_params;

fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param HTTPS $https if_not_empty;
fastcgi_param HTTP_PROXY "";

# nginx owns transport policy and should not expose the application runtime.
fastcgi_hide_header Strict-Transport-Security;
fastcgi_hide_header X-Powered-By;

fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
fastcgi_busy_buffers_size 64k;

fastcgi_pass unix:/run/$site_tag/php-fpm.sock;
