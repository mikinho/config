location = /maintenance.html {
    # Only error_page may serve this response. Direct requests must not expose
    # or invite indexing of the operational maintenance document.
    internal;

    # Preserve temporary-failure semantics when the optional document has not
    # been provisioned instead of replacing an upstream 5xx response with 404.
    try_files /maintenance.html =503;
}
