# nginx/includes/proxy-common.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Shared transport policy for HTTP reverse-proxy locations. The site supplies
# proxy_pass and any application-specific overrides after this include. For
# WebSocket endpoints use includes/proxy-websocket.conf instead; the two
# differ only in connection handling and read timeout.
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# This nginx host is an edge server directly exposed to the public internet.
# Never append a client-supplied X-Forwarded-For chain here: overwrite it with
# nginx's validated $remote_addr to prevent application-level IP spoofing. If
# the trusted-proxy profile is selected later, the real-IP module first updates
# $remote_addr from only explicitly trusted peers, so this remains correct.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Do not pass the legacy Proxy request header into an application environment.
# CGI-derived runtimes may interpret it as the outbound HTTP_PROXY setting.
proxy_set_header Proxy "";

# Edge-assigned request id, overwriting any client-supplied value. It is the
# $request_id field of the shared JSON access log, so an application that
# adopts it can be correlated with the edge line for the same request.
proxy_set_header X-Request-Id $request_id;

# An empty Connection header enables upstream keepalive; the upstream block
# must declare a keepalive pool for it to take effect.
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
