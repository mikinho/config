# Optional: PHP-FPM routing for applications that explicitly require PATH_INFO.
# Capture the value before try_files, which otherwise clears $fastcgi_path_info.
fastcgi_split_path_info ^(.+\.php)(/.*)$;
set $path_info $fastcgi_path_info;

include includes/php-fpm-by-tag.conf;

fastcgi_param PATH_INFO $path_info;
