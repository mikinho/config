# nginx/includes/block-project-files.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Server-context only. Opt in for sites that never intentionally publish
# package manifests, dependency lockfiles, container build files, or editor
# remnants. Keep archive formats out of this list because sites may expose
# legitimate downloads with those suffixes.
location ~* (?:^|/)(?:package(?:-lock)?\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.ya?ml|composer\.(?:json|lock)|Pipfile(?:\.lock)?|requirements(?:-[^/]+)?\.txt|Dockerfile(?:\.[^/]+)?|(?:docker-)?compose(?:\.[^/]+)?\.ya?ml|web\.config)(?:/|$) {
    access_log off;
    log_not_found off;
    return 444;
}

location ~* (?:~|\.swo|\.rej)$ {
    access_log off;
    log_not_found off;
    return 444;
}
