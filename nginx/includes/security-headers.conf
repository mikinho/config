# nginx/includes/security-headers.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Nginx is authoritative for HSTS. Subdomain coverage and preload are
# site-specific commitments and must be enabled only after the complete domain
# namespace has been verified as HTTPS-only.
proxy_hide_header Strict-Transport-Security;

# The application runtime is not advertised through the edge. The shared
# PHP-FPM include hides the same header for FastCGI responses.
proxy_hide_header X-Powered-By;

# Preserve this baseline when a server or location adds its own headers.
# A site replacing the complete policy can explicitly select
# add_header_inherit off and define every required header at that scope.
add_header_inherit merge;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy $csp_fallback always;
add_header X-Content-Type-Options $xcto_fallback always;
add_header Referrer-Policy $refpol_fallback always;
add_header X-Frame-Options $xfo_fallback always;
add_header Permissions-Policy $pp_fallback always;
