# stubs/ratelimit.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

geo $limit {
    default     1;
    127.0.0.0/8 0;
    ::1/128     0;
}

map $limit $limit_key {
    default $binary_remote_addr;
    0       "";
}

limit_req_zone $limit_key zone=req_general:10m rate=10r/s;
limit_req_zone $limit_key zone=req_auth:1m rate=1r/s;
limit_conn_zone $limit_key zone=conn_general:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
