# Optional: load the zstd dynamic modules at main context.
# Install together with stubs/http/zstd.conf and stubs/api/zstd.conf.
# Keep this after stubs/brotli.conf in nginx.conf's filename-sorted include.
# With the supported modules' ordering metadata, filters run in reverse
# registration order: zstd, then Brotli, then built-in gzip. Moving the
# http-level on/off directives or installer --profile arguments does not set
# preference. Recheck real GET responses after module/package changes; see
# the compression verification matrix in nginx/README.md.
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;
