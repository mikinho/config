# Optional: load the Brotli dynamic modules at main context.
# Install together with stubs/http/brotli.conf.
# Keep this loader before stubs/zstd.conf so eligible API responses try zstd
# first; HTTP directive order does not select the encoder.
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
