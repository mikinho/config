# Required for the provided HTTP/3 listener. A persistent key keeps stateless
# reset and address-validation tokens valid across nginx configuration reloads.
quic_host_key /etc/nginx/quic_host.key;

# Validate client addresses before committing server state, defending the UDP
# listener against spoofed and replayed initial packets. Costs one round trip
# on new connections; resumed connections present a token and skip it.
quic_retry on;
