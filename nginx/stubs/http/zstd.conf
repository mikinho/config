# nginx/stubs/http/zstd.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional: zstd response compression policy.
# Install together with the main-context stubs/zstd.conf module loader and
# stubs/api/zstd.conf. Compression stays off at this level: API locations opt
# in through include stubs/api/*.conf, so HTML and static routes keep their
# gzip and Brotli encoders, and clients without zstd keep negotiating those.
# GetPageSpeed zstd 0.2.2+ emits Vary: Accept-Encoding independently;
# nginx.conf keeps gzip_vary enabled for the gzip/Brotli fallbacks.
zstd off;
# Level 3 is our dynamic-response baseline; the nginx module defaults to 1.
# Measure CPU, latency, and payload size before changing it.
zstd_comp_level 3;
# The floor applies only to responses that carry Content-Length; a chunked
# upstream response bypasses this size check but must meet other eligibility
# checks (status, content type, accepted encoding, and an unencoded body).
zstd_min_length 256;
# text/html is always included by the module, including on opted-in API
# routes. Keep the API media types covered by the gzip and Brotli fallbacks.
zstd_types text/css application/json application/problem+json application/ld+json application/vnd.api+json application/x-ndjson application/javascript application/x-javascript text/xml application/xml application/xhtml+xml application/atom+xml application/rss+xml text/javascript application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype application/x-font-ttf font/eot font/opentype font/otf font/ttf image/svg+xml image/vnd.microsoft.icon application/manifest+json application/wasm text/plain text/csv image/x-icon;
