# nginx/stubs/http/upstream-fallback.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# The fallback stays deliberately narrow: framing and base-URI hijacking are
# safe to restrict for any application, while a default-src would break every
# application that did not declare its own policy.
map $upstream_http_content_security_policy $csp_fallback {
    ""      "frame-ancestors 'self'; base-uri 'self'";
    default "";
}

map $upstream_http_x_content_type_options $xcto_fallback {
    ""      "nosniff";
    default "";
}

map $upstream_http_referrer_policy $refpol_fallback {
    ""      "strict-origin-when-cross-origin";
    default "";
}

map $upstream_http_x_frame_options $xfo_fallback {
    ""      "SAMEORIGIN";
    default "";
}

map $upstream_http_permissions_policy $pp_fallback {
    ""      "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=()";
    default "";
}

# Cache-Control is intentionally not defined with the security-header
# fallbacks. Its static policy belongs to the application, so loading that map
# globally would make nginx fail when no application defines
# $static_cache_control. Applications that need mixed static/proxy cache
# behavior opt in through includes/cache-control-fallback.conf.
