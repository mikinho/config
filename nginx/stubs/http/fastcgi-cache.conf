# nginx/stubs/http/fastcgi-cache.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional: WordPress FastCGI cache support.
# Install this stub only on hosts that use
# includes/wordpress-cache-by-tag.conf.
fastcgi_cache_path /var/lib/nginx/fastcgi levels=1:2 keys_zone=wp:100m inactive=60m max_size=1g;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# Safe universal default: any cookie may represent authentication,
# personalization, commerce, or consent state. A site may replace this broad
# bypass only after documenting and testing every response-affecting cookie.
map $http_cookie $wp_has_cookie {
    ""      0;
    default 1;
}

map $http_authorization $wp_has_authorization {
    ""      0;
    default 1;
}

# Query parameters can select previews, searches, locale, commerce, or plugin-
# specific variants. The shared cache therefore stores only canonical,
# query-less requests; an audited site may define a narrower local policy.
map $args $wp_has_query {
    ""      0;
    default 1;
}

map $request_method $wp_nocache_method {
    default 1;
    GET     0;
    HEAD    0;
}

map $request_uri $wp_nocache_uri {
    default            0;
    "~*/wp-admin/"     1;
    "~*/wp-json/"      1;
    "~*/wp-[^/]*\.php" 1;
    "~*/feed/?$"       1;
    "~*sitemap.*\.xml" 1;
}

# Administrative cache revalidation: when a site or application supplies an
# authorized X-Purge-Key header, nginx bypasses the existing cache, queries
# upstream, and refreshes the cache entry with the fresh response.
map $http_x_purge_key $wp_has_purge_header {
    ""      0;
    default 1;
}

