# stubs/http/logging.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Required privacy-preserving access-log inputs. Keep the original request path
# for diagnostics, but discard query values that may carry searches, reset
# tokens, authorization codes, or other personal data.
map $request_uri $access_log_request_path {
    default "";
    ~^(?<access_log_path_capture>[^?]*) $access_log_path_capture;
}

map $http_referer $access_log_referer {
    default "";
    ~^(?<access_log_referer_capture>[^?]*) $access_log_referer_capture;
}

map $args $access_log_has_query {
    ""      false;
    default true;
}

# Successful static assets stay out of access logs, while deployment failures
# remain observable. access_log evaluates this map after the response status is
# known; the value 0 suppresses the dedicated conditional log.
map $status $log_static_asset_failure {
    default 0;
    ~^[45]  1;
}
