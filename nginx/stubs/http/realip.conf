# Optional: restore client addresses supplied by explicitly trusted proxies.
# The included deployment-local files must contain only set_real_ip_from
# directives for immediate proxy addresses or CIDRs.
include trusted-proxies/*.conf;

real_ip_header X-Forwarded-For;
real_ip_recursive on;
