# stubs/http/tls.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Required: shared TLS baseline for HTTPS sites.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_buffer_size 4k;

# Protocol selection occurs before nginx can apply an SNI-selected server's
# configuration. Keep the shared policy here or on each listener's default
# server rather than relying on a non-default virtual host to override it.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_conf_command Options PrioritizeChaCha;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
