# Optional: prefer hybrid post-quantum key exchange while retaining classical
# X25519 and P-256 fallbacks. Requires nginx to use OpenSSL 3.5.1 or newer (or
# another compatible TLS provider exposing X25519MLKEM768). nginx -t
# deliberately fails when this profile is selected with an incompatible build.
# A site using an ECDSA certificate on another curve must include that curve.
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
