# stubs/http/brotli.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional: Brotli response compression.
# Install together with the main-context stubs/brotli.conf module loader.
brotli on;
brotli_static on;
brotli_comp_level 4;
brotli_types text/css application/json application/javascript application/x-javascript text/xml application/xml application/rss+xml text/javascript application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype application/x-font-ttf font/eot font/opentype font/otf image/svg+xml image/vnd.microsoft.icon application/manifest+json application/wasm text/plain image/x-icon;
