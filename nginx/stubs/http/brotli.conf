# nginx/stubs/http/brotli.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional: Brotli response compression.
# Install together with the main-context stubs/brotli.conf module loader.
# Vary: Accept-Encoding is emitted through gzip_vary in nginx.conf.
brotli on;
brotli_static on;
brotli_comp_level 4;
brotli_min_length 256;
# Match the API media types in the zstd policy for clients using this fallback.
brotli_types text/css application/json application/problem+json application/ld+json application/vnd.api+json application/x-ndjson application/javascript application/x-javascript text/xml application/xml application/xhtml+xml application/atom+xml application/rss+xml text/javascript application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype application/x-font-ttf font/eot font/opentype font/otf font/ttf image/svg+xml image/vnd.microsoft.icon application/manifest+json application/wasm text/plain text/csv image/x-icon;
