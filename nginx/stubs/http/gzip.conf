# stubs/http/gzip.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional: gzip response compression.
gzip on;
gzip_static on;
gzip_comp_level 6;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/css application/json application/javascript application/x-javascript text/xml application/xml application/xhtml+xml application/atom+xml application/rss+xml text/javascript application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype application/x-font-ttf font/eot font/opentype font/otf font/ttf image/svg+xml image/vnd.microsoft.icon application/manifest+json application/wasm text/plain image/x-icon;
gzip_buffers 16 8k;
