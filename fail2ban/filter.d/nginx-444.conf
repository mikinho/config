# fail2ban/filter.d/nginx-444.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Matches combined-format access log entries answered with status 444, which
# the baseline's default HTTP server returns for unknown host names. Status
# 421 is deliberately not matched: HTTP/2 and HTTP/3 connection reuse can
# produce legitimate 421 responses that the client transparently retries.

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[^"]*" 444 \d+
ignoreregex =
