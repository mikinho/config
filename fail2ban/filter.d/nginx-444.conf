# fail2ban/filter.d/nginx-444.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Matches entries from the JSON access log defined by nginx/nginx.conf that
# were answered with status 444, which the baseline's default HTTP server
# returns for unknown host names. Status 421 is deliberately not matched:
# HTTP/2 and HTTP/3 connection reuse can produce legitimate 421 responses
# that the client transparently retries.
#
# The field order is fixed by the shared log_format; update this expression
# together with any change to that format.

[Definition]
_json_str = "(?:[^"\\]|\\.)*"
failregex = ^\{"time":%(_json_str)s,"request_id":%(_json_str)s,"remote_addr":"<HOST>","remote_user":%(_json_str)s,"host":%(_json_str)s,"request_method":%(_json_str)s,"request_path":%(_json_str)s,"query_present":(?:true|false),"status":444,
ignoreregex =
