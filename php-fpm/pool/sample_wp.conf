; php-fpm/pool/sample_wp.conf
;
; Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho

[sample_wp]
; The systemd instance supplies the worker identity.

; PHP-FPM owns the socket. RHEL-family and Remi builds include POSIX ACL
; support, allowing nginx access without running the site under nginx's group.
listen = /run/sample_wp/php-fpm.sock
listen.acl_users = nginx
listen.mode = 0660

pm = ondemand
; Capacity example: replace this after measuring worker RSS and assigning a
; per-site memory budget. Do not multiply this value across sites blindly.
; With the memory_limit below, the PHP-managed allocation budget is legible in
; this file: pm.max_children x memory_limit (8 x 128M = 1 GiB). Native and
; extension allocations can make process RSS higher. Size the pair together.
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 500

; The per-request half of the budget arithmetic above. WordPress admin and
; media operations may need more; raise it with pm.max_children in view.
php_admin_value[memory_limit] = 128M

chdir = /
; Optional only after validating every required path inside the jail:
; chroot = /var/www/sample_wp

security.limit_extensions = .php
clear_env = yes

; open_basedir is defense in depth, not a security boundary, and disables the
; realpath cache. Remove it when application compatibility or performance
; requires that tradeoff; the systemd and SELinux sandboxes remain primary.
php_admin_value[open_basedir] = /var/www/sample_wp:/var/lib/php/session/sample_wp:/tmp
php_admin_value[session.save_path] = /var/lib/php/session/sample_wp
php_admin_value[upload_tmp_dir] = /var/www/sample_wp/var/tmp

; Explicit upload budget; php.ini defaults otherwise cap uploads at 2 MB no
; matter what nginx permits. The chain must stay coherent: upload_max_filesize
; <= post_max_size <= the site's nginx client_max_body_size (the sample site
; raises it to 20M). Size all three together.
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M

; Optional application policy. Some WordPress plugins and deployment tools
; need one or more of these features; narrow or remove the restrictions only
; after reviewing the application.
php_admin_flag[allow_url_fopen] = 0
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Keep application and worker output in the per-instance journal.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = 1
; Never expose PHP or startup diagnostics in a production HTTP response, even
; if the selected package's global php.ini is accidentally development-oriented.
php_admin_flag[display_errors] = 0
php_admin_flag[display_startup_errors] = 0
catch_workers_output = yes
decorate_workers_output = no

; Hard-stop stalled web requests before they can occupy this small pool for an
; unbounded period. nginx's default FastCGI read timeout is also 60 seconds,
; although it measures silence between reads rather than total execution time.
; Prefer WP-CLI or a background worker for longer maintenance. A site that
; permits longer browser-driven jobs must raise both deadlines deliberately.
request_terminate_timeout = 60s
request_terminate_timeout_track_finished = yes
