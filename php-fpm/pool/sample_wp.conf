; php-fpm/pool/sample_wp.conf
;
; Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho

[sample_wp]
; The systemd instance supplies the worker identity.

; PHP-FPM owns the socket. RHEL-family and Remi builds include POSIX ACL
; support, allowing nginx access without running the site under nginx's group.
listen = /run/sample_wp/php-fpm.sock
listen.acl_users = nginx
listen.mode = 0660

pm = ondemand
; Capacity example: replace this after measuring worker RSS and assigning a
; per-site memory budget. Do not multiply this value across sites blindly.
pm.max_children = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500

chdir = /
; Optional only after validating every required path inside the jail:
; chroot = /var/www/sample_wp

security.limit_extensions = .php
clear_env = yes

; open_basedir is defense in depth, not a security boundary, and disables the
; realpath cache. Remove it when application compatibility or performance
; requires that tradeoff; the systemd and SELinux sandboxes remain primary.
php_admin_value[open_basedir] = /var/www/sample_wp:/var/lib/php/session/sample_wp:/tmp
php_admin_value[session.save_path] = /var/lib/php/session/sample_wp
php_admin_value[upload_tmp_dir] = /var/www/sample_wp/var/tmp

; Optional application policy. Some WordPress plugins and deployment tools
; need one or more of these features; narrow or remove the restrictions only
; after reviewing the application.
php_admin_flag[allow_url_fopen] = 0
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Keep application and worker output in the per-instance journal.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = 1
catch_workers_output = yes
decorate_workers_output = no

request_terminate_timeout = 60s
request_terminate_timeout_track_finished = yes
