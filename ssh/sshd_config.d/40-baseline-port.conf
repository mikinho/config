# ssh/sshd_config.d/40-baseline-port.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Non-default port to shed commodity scanner noise; it is not an access
# control. The host must label the port for SELinux and open it in firewalld
# before sshd reloads, and fail2ban's sshd jail must ban this port. See
# ssh/README.md for the lockout-safe cutover order.
Port 2356
