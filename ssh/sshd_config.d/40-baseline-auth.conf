# ssh/sshd_config.d/40-baseline-auth.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Root never authenticates directly; administration happens through a named
# account and privilege escalation, keeping an audit trail per operator.
PermitRootLogin no

# Key-based authentication only. Keyboard-interactive must be disabled with
# password authentication or PAM can still prompt for a password through the
# interactive path, silently defeating this policy.
PasswordAuthentication no
KbdInteractiveAuthentication no
