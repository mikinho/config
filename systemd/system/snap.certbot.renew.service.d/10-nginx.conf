# systemd/system/snap.certbot.renew.service.d/10-nginx.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional Snap backend. Snap owns the generated base service; this drop-in
# restores the nginx ordering, timeout, umask, and post-renewal audit contract
# provided by the repository's native certbot.service.
[Unit]
Requires=nginx.service
Wants=network-online.target
After=network-online.target nginx.service

[Service]
UMask=0077
TimeoutStartSec=1h
ExecStopPost=/bin/systemctl reload nginx.service
