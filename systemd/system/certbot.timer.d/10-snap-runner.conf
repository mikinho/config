# systemd/system/certbot.timer.d/10-snap-runner.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# Optional Snap backend. Keep the repository timer's calendar, jitter, and
# persistent catch-up policy while delegating renewal to Snap's generated
# service. Install only with the matching snap.certbot.renew.service drop-in
# and disable Snap's generated timer so exactly one scheduler remains active.
[Timer]
Unit=snap.certbot.renew.service
