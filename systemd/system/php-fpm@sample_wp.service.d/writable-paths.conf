# systemd/system/php-fpm@sample_wp.service.d/writable-paths.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

[Service]
# Required private application state and optional public WordPress uploads.
# %i is this drop-in's instance name, so copying the directory to
# php-fpm@SITE_TAG.service.d/ adapts the paths without editing them; the pool
# configuration for the same tag must use the matching document root.
ReadWritePaths=/var/www/%i/var
ReadWritePaths=-/var/www/%i/wordpress/wp-content/uploads
