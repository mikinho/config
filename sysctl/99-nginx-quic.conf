# sysctl/99-nginx-quic.conf

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

# The QUIC listeners in sites/_https_.conf request 2 MiB socket buffers
# (rcvbuf=2m sndbuf=2m). The kernel silently caps setsockopt requests at
# these limits, which default to roughly 208 KiB, so raise them to match.
# Only the maximums change; TCP sockets keep autotuning within their own
# net.ipv4.tcp_rmem and tcp_wmem bounds.
net.core.rmem_max = 2097152
net.core.wmem_max = 2097152
