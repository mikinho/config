name: Validate configuration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run so pinned-package staleness and repository drift surface
    # without waiting for a push.
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: configuration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    # GitHub's hosted Linux executor is Ubuntu. It only runs portable repository
    # tooling here; deployment-facing validation runs in RHEL-family containers.
    name: Deployment profiles (hosted executor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Validate installer and profile coverage
        run: |
          shellcheck deploy/install-nginx selinux/apply-nginx-policy
          deploy/install-nginx --check

      - name: Exercise a full profile render
        run: |
          deploy/install-nginx \
            --output build/full \
            --profile brotli \
            --profile gzip \
            --profile post-quantum \
            --profile quic-bpf \
            --profile trusted-proxy \
            --profile websocket \
            --profile wordpress
          test -s build/full/quic_host.key
          test -s build/full/stubs/http/post-quantum.conf
          test "$(stat --format='%a' build/full/quic_host.key)" = 600
          if deploy/install-nginx --output build/full; then
            echo 'installer unexpectedly overwrote an existing output' >&2
            exit 1
          fi

  nginx:
    name: nginx ${{ matrix.version }} on Rocky Linux 9
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            repository: packages
            version: 1.30.4
          - channel: mainline
            repository: packages/mainline
            version: 1.31.3
          # Unpinned drift check: installs whatever the stable repository
          # currently ships, so a package family the pinned entries no longer
          # represent fails here first.
          - channel: stable
            repository: packages
            version: latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render CI profile
        run: |
          deploy/install-nginx \
            --output build/ci \
            --profile gzip \
            --profile trusted-proxy \
            --profile websocket \
            --profile wordpress
          test ! -e build/ci/stubs/http/post-quantum.conf

      - name: Test nginx configuration
        run: |
          docker run --rm \
            --env EXPECTED_NGINX_VERSION="${{ matrix.version }}" \
            --env NGINX_REPOSITORY="${{ matrix.repository }}" \
            --volume "$PWD/build/ci:/profile:ro" \
            --volume "$PWD/build/ci/quic_host.key:/etc/nginx/quic_host.key:ro" \
            rockylinux:9 \
            /bin/bash -euxo pipefail -c '
              printf "%s\n" \
                "[nginx]" \
                "name=nginx ${{ matrix.channel }} repository" \
                "baseurl=https://nginx.org/${NGINX_REPOSITORY}/centos/\$releasever/\$basearch/" \
                "gpgcheck=1" \
                "enabled=1" \
                "gpgkey=https://nginx.org/keys/nginx_signing.key" \
                "module_hotfixes=true" \
                > /etc/yum.repos.d/nginx.repo
              nginx_package="nginx-${EXPECTED_NGINX_VERSION}"
              if [ "${EXPECTED_NGINX_VERSION}" = latest ]; then
                nginx_package=nginx
              fi
              dnf install --assumeyes \
                ca-certificates \
                "${nginx_package}" \
                openssl
              openssl version
              nginx -v
              if [ "${EXPECTED_NGINX_VERSION}" != latest ]; then
                nginx -v 2>&1 |
                  grep --fixed-strings "nginx/${EXPECTED_NGINX_VERSION}"
              fi
              nginx -V 2>&1 |
                grep --fixed-strings -- "--with-http_v3_module"
              mkdir -p \
                /tmp/nginx/includes \
                /tmp/nginx/sites \
                /tmp/nginx/stubs/http \
                /tmp/nginx/upstreams \
                /tmp/nginx/trusted-proxies \
                /var/lib/nginx/client_tmp \
                /var/lib/nginx/fastcgi \
                /var/lib/nginx/fastcgi_tmp \
                /var/lib/nginx/proxy_tmp \
                /var/run/nginx \
                /var/run/lock/nginx \
                /var/www/letsencrypt
              cp -R /profile/. /tmp/nginx/
              cp /etc/nginx/mime.types /etc/nginx/fastcgi_params /tmp/nginx/
              nginx -t -p /tmp/nginx/ -c nginx.conf
            '

  systemd:
    name: Units on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify unit files
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              dnf install --assumeyes logrotate shadow-utils systemd
              install -D -m 0755 /usr/bin/true /usr/sbin/nginx
              install -D -m 0755 /usr/bin/true /sbin/php-fpm
              install -D -m 0755 /usr/bin/true /bin/certbot
              getent group nginx >/dev/null || groupadd --system nginx
              id nginx >/dev/null 2>&1 ||
                useradd --system --gid nginx --no-create-home nginx
              id sample_wp >/dev/null 2>&1 ||
                useradd --system --user-group --no-create-home sample_wp
              install -d -o sample_wp -g sample_wp -m 0700 \
                /var/www/sample_wp/var
              install -m 0644 /workspace/systemd/php-fpm@.service \
                /etc/systemd/system/php-fpm@.service
              install -D -m 0644 \
                /workspace/systemd/php-fpm@sample_wp.service.d/writable-paths.conf \
                /etc/systemd/system/php-fpm@sample_wp.service.d/writable-paths.conf
              systemd-analyze --version
              systemd-analyze verify \
                /workspace/systemd/nginx.service \
                /workspace/systemd/certbot.service \
                /workspace/systemd/certbot.timer \
                php-fpm@sample_wp.service
              logrotate --debug /workspace/logrotate/nginx
            '

  php-fpm:
    name: PHP-FPM configuration on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the public PHP-FPM sample
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              if grep --quiet "release 9" /etc/redhat-release; then
                dnf module install --assumeyes php:8.3/common
              else
                dnf install --assumeyes php-fpm
              fi
              dnf install --assumeyes shadow-utils
              getent group nginx >/dev/null || groupadd --system nginx
              id nginx >/dev/null 2>&1 ||
                useradd --system --gid nginx --no-create-home nginx
              id sample_wp >/dev/null 2>&1 ||
                useradd --system --user-group --no-create-home sample_wp
              install -D -m 0644 /workspace/php-fpm/sites/sample_wp.conf \
                /etc/php-fpm.d/sites/sample_wp.conf
              install -D -m 0644 /workspace/php-fpm/pool/sample_wp.conf \
                /etc/php-fpm.d/pool/sample_wp.conf
              install -d -o sample_wp -g sample_wp -m 0711 /run/sample_wp
              install -d -o sample_wp -g sample_wp -m 0700 \
                /var/lib/php/session/sample_wp \
                /var/www/sample_wp/var/tmp
              /sbin/php-fpm --version |
                grep --extended-regexp "^PHP (8\.[3-9]|9\.)"
              runuser --user sample_wp -- \
                /sbin/php-fpm --test \
                  --fpm-config /etc/php-fpm.d/sites/sample_wp.conf
            '

  ssh:
    name: sshd drop-ins on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify effective sshd configuration
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              dnf install --assumeyes openssh-server
              grep -q "^Include /etc/ssh/sshd_config.d/\*.conf" /etc/ssh/sshd_config
              install -m 0644 /workspace/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config.d/
              ssh-keygen -A
              /usr/sbin/sshd -t
              /usr/sbin/sshd -T | grep -x "port 2356"
              test "$(/usr/sbin/sshd -T | grep -c "^port ")" = 1
              /usr/sbin/sshd -T | grep -x "permitrootlogin no"
              /usr/sbin/sshd -T | grep -x "passwordauthentication no"
              /usr/sbin/sshd -T | grep -x "kbdinteractiveauthentication no"
            '

  firewalld:
    name: firewalld config on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate services and zone
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              dnf install --assumeyes firewalld
              install -m 0644 /workspace/firewalld/services/*.xml /etc/firewalld/services/
              install -m 0644 /workspace/firewalld/zones/*.xml /etc/firewalld/zones/
              firewall-offline-cmd --check-config
              firewall-offline-cmd --info-service=nginx
              firewall-offline-cmd --info-service=ssh-hardened
              firewall-offline-cmd --zone=public --list-services |
                grep -w nginx
              firewall-offline-cmd --zone=public --list-services |
                grep -w ssh-hardened
            '

  selinux:
    name: SELinux assets on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build policy module and inspect port labels
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              dnf install --assumeyes \
                checkpolicy \
                policycoreutils \
                policycoreutils-python-utils \
                selinux-policy-targeted
              checkmodule -M -m \
                -o /tmp/nginx_quic_bpf.mod \
                /workspace/selinux/nginx_quic_bpf.te
              semodule_package \
                -o /tmp/nginx_quic_bpf.pp \
                -m /tmp/nginx_quic_bpf.mod
              # Informational: shows whether this policy release already
              # labels UDP 443; apply-nginx-policy handles either state.
              semanage port -l | grep ^http_port_t
            '

  secrets:
    name: Public secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
