# .github/workflows/validate.yml

#
# Author: Michael Welter <me@mikinho.com> - https://github.com/mikinho
#

name: Validate configuration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run so pinned-package staleness and repository drift surface
    # without waiting for a push.
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: configuration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    # GitHub's hosted Linux executor is Ubuntu. It only runs portable repository
    # tooling here; deployment-facing validation runs in RHEL-family containers.
    name: Deployment profiles (hosted executor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      SHELLCHECK_VERSION: 0.11.0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq
          # Pin both the release and archive digest; do not execute the
          # project's mutable download helper directly from the network.
          actionlint_archive="/tmp/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "${actionlint_archive}" |
            sha256sum --check --strict
          tar --extract --gzip \
            --file "${actionlint_archive}" \
            --directory /tmp \
            actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

          shellcheck_archive="/tmp/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${shellcheck_archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          printf '%s  %s\n' \
            'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6' \
            "${shellcheck_archive}" |
            sha256sum --check --strict
          tar --extract --gzip \
            --file "${shellcheck_archive}" \
            --directory /tmp \
            --strip-components 1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 /tmp/shellcheck /usr/local/bin/shellcheck
          shellcheck --version |
            grep --fixed-strings "version: ${SHELLCHECK_VERSION}"

      - name: Check pinned validation tool releases
        if: github.event_name == 'schedule'
        run: |
          latest_tag=$(curl --fail --location --silent --show-error \
            https://api.github.com/repos/rhysd/actionlint/releases/latest |
            jq --exit-status --raw-output '.tag_name | select(type == "string")')
          if [ "${latest_tag}" != "v${ACTIONLINT_VERSION}" ]; then
            echo "Actionlint ${ACTIONLINT_VERSION} is stale; latest release is ${latest_tag}." >&2
            exit 1
          fi
          latest_tag=$(curl --fail --location --silent --show-error \
            https://api.github.com/repos/koalaman/shellcheck/releases/latest |
            jq --exit-status --raw-output '.tag_name | select(type == "string")')
          if [ "${latest_tag}" != "v${SHELLCHECK_VERSION}" ]; then
            echo "ShellCheck ${SHELLCHECK_VERSION} is stale; latest release is ${latest_tag}." >&2
            exit 1
          fi

      - name: Validate installer and profile coverage
        run: |
          actionlint -color
          tests/run-all-local

      - name: Exercise a full profile render
        run: |
          deploy/install-nginx \
            --output build/full \
            --profile brotli \
            --profile gzip \
            --profile post-quantum \
            --profile quic-bpf \
            --profile trusted-proxy \
            --profile websocket \
            --profile wordpress-cache
          test -s build/full/quic_host.key
          test -s build/full/stubs/http/post-quantum.conf
          test "$(stat --format='%a' build/full/quic_host.key)" = 600
          if deploy/install-nginx --output build/full; then
            echo 'installer unexpectedly overwrote an existing output' >&2
            exit 1
          fi

      - name: Exercise documented production render
        run: |
          deploy/install-nginx \
            --output build/production \
            --profile gzip \
            --profile brotli \
            --profile quic-bpf \
            --profile websocket \
            --profile wordpress-cache
          grep --fixed-strings 'profile brotli' build/production/INSTALL-PROFILE
          grep --fixed-strings 'profile gzip' build/production/INSTALL-PROFILE
          grep --fixed-strings 'profile quic-bpf' build/production/INSTALL-PROFILE
          grep --fixed-strings 'profile websocket' build/production/INSTALL-PROFILE
          grep --fixed-strings 'profile wordpress-cache' build/production/INSTALL-PROFILE
          test -e build/production/stubs/http/websocket.conf
          test ! -e build/production/stubs/http/realip.conf
          test ! -e build/production/stubs/http/post-quantum.conf

      - name: Exercise the PHP site renderer
        run: |
          deploy/install-php-site --output build/php-site --tag example_wp
          test -f build/php-site/etc/php-fpm.d/sites/example_wp.conf
          test -f build/php-site/etc/php-fpm.d/pool/example_wp.conf
          test -f build/php-site/etc/systemd/system/php-fpm@example_wp.service.d/writable-paths.conf
          if grep -r sample_wp build/php-site/etc; then
            echo 'renderer left sample tokens behind' >&2
            exit 1
          fi
          if deploy/install-php-site --output build/php-site --tag example_wp; then
            echo 'renderer unexpectedly overwrote an existing output' >&2
            exit 1
          fi

  redis-package:
    name: Redis 8.2.9 package and profiles on ${{ matrix.platform.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Rocky Linux 9
            image: rockylinux:9
          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact RPM and exercise all four configurations
        env:
          REDIS_TEST_IMAGE: ${{ matrix.platform.image }}
        run: |
          redis_image=$REDIS_TEST_IMAGE
          docker pull "$redis_image"
          redis_image_reference=$(
            docker image inspect \
              --format '{{ index .RepoDigests 0 }}' \
              "$redis_image"
          )
          test -n "$redis_image_reference"
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "$redis_image_reference" \
            /workspace/tests/redis-package-el9

  rsync-package:
    name: rsync 3.5.0 package on CentOS Stream 9
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check pinned upstream release
        if: github.event_name == 'schedule'
        run: |
          latest_tag=$(
            curl --fail --location --silent --show-error \
              https://api.github.com/repos/RsyncProject/rsync/releases/latest |
              python3 -c \
                'import json, sys; print(json.load(sys.stdin)["tag_name"])'
          )
          if [ "$latest_tag" != v3.5.0 ]; then
            echo "Pinned rsync 3.5.0 is stale; latest release is ${latest_tag}." >&2
            exit 1
          fi

      - name: Build and audit EL9 RPMs
        run: |
          rsync_image=quay.io/centos/centos:stream9
          docker pull "$rsync_image"
          rsync_image_reference=$(
            docker image inspect \
              --format '{{ index .RepoDigests 0 }}' \
              "$rsync_image"
          )
          test -n "$rsync_image_reference"
          docker run --rm \
            --env "RSYNC_BUILD_IMAGE_REFERENCE=$rsync_image_reference" \
            --volume "$PWD:/workspace:ro" \
            "$rsync_image" \
            /bin/bash -euxo pipefail -c '
              dnf install --assumeyes \
                acl \
                attr \
                binutils \
                cpio \
                curl-minimal \
                dnf-plugins-core \
                gcc \
                gcc-c++ \
                gawk \
                gnupg2 \
                libacl-devel \
                libattr-devel \
                libzstd-devel \
                lz4-devel \
                make \
                openssl-devel \
                popt-devel \
                python3 \
                rpm-build \
                shadow-utils \
                util-linux \
                zlib-devel

              vendor_version="$(
                dnf --quiet repoquery --latest-limit 1 \
                  --queryformat "%{version}" rsync |
                  tail -n 1
              )"
              test -n "$vendor_version"
              if [ "$(printf "%s\n%s\n" 3.5.0 "$vendor_version" |
                    sort --version-sort | head -n 1)" = 3.5.0 ]; then
                echo "CentOS now supplies rsync ${vendor_version}; retire the package bridge." >&2
                exit 1
              fi

              useradd --create-home --uid 1000 rsync-builder
              install -d -o rsync-builder -g rsync-builder -m 0755 \
                /tmp/rsync-output
              runuser -u rsync-builder -- \
                /workspace/packages/rsync/build-el9 \
                --output /tmp/rsync-output/rsync-3.5.0-el9
              cd /tmp/rsync-output/rsync-3.5.0-el9
              sha256sum --check --strict SHA256SUMS
              test -f rsync-3.5.0-0.2.mikinho.el9.x86_64.rpm
              test -f rsync-rrsync-3.5.0-0.2.mikinho.el9.noarch.rpm
              test -f rsync-3.5.0-0.2.mikinho.el9.src.rpm
            '

  nginx:
    name: nginx ${{ matrix.version }} on Rocky Linux 9
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            repository: packages
            version: 1.30.4
          - channel: mainline
            repository: packages/mainline
            version: 1.31.3
          # Unpinned drift check: installs whatever the stable repository
          # currently ships, so a package family the pinned entries no longer
          # represent fails here first.
          - channel: stable
            repository: packages
            version: latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render CI profile
        run: |
          deploy/install-nginx \
            --output build/ci-safe \
            --profile gzip \
            --profile trusted-proxy \
            --profile websocket
          test ! -e build/ci-safe/stubs/http/fastcgi-cache.conf
          test ! -e build/ci-safe/stubs/http/post-quantum.conf
          test ! -e build/ci-safe/sites/sample_wp.conf.example
          install -m 0644 \
            nginx/sites/sample_wp.conf.example \
            build/ci-safe/sites/sample_wp.conf
          printf '%s\n' \
            'server {' \
            '    listen 127.0.0.1:8080;' \
            '    server_name probe-guards.invalid;' \
            '    include includes/block-cgi.conf;' \
            '    include includes/block-php.conf;' \
            '    include includes/block-project-files.conf;' \
            '    include includes/block-wordpress-probes.conf;' \
            '}' \
            > build/ci-safe/sites/probe-guards.conf
          printf '%s\n' \
            'server {' \
            '    listen 127.0.0.1:18081;' \
            '    server_name runtime-backend.invalid;' \
            '    add_header_inherit off;' \
            "    add_header Content-Security-Policy \"default-src 'none'\" always;" \
            "    return 200 \"proxy=\$http_proxy\\nxff=\$http_x_forwarded_for\\n\";" \
            '}' \
            'server {' \
            '    listen 127.0.0.1:18080;' \
            '    server_name runtime-edge.invalid;' \
            '    location / {' \
            '        include includes/proxy-common.conf;' \
            '        proxy_pass http://127.0.0.1:18081;' \
            '    }' \
            '}' \
            > build/ci-safe/sites/runtime-policy.conf

          deploy/install-nginx \
            --output build/ci-cache \
            --profile gzip \
            --profile trusted-proxy \
            --profile websocket \
            --profile wordpress-cache
          test -e build/ci-cache/stubs/http/fastcgi-cache.conf
          test ! -e build/ci-cache/stubs/http/post-quantum.conf
          install -m 0644 \
            nginx/sites/sample_wp.conf.example \
            build/ci-cache/sites/sample_wp.conf
          cp \
            build/ci-safe/sites/probe-guards.conf \
            build/ci-cache/sites/probe-guards.conf
          cp \
            build/ci-safe/sites/runtime-policy.conf \
            build/ci-cache/sites/runtime-policy.conf
          sed -i \
            's|includes/wordpress-by-tag.conf|includes/wordpress-cache-by-tag.conf|' \
            build/ci-cache/sites/sample_wp.conf
          grep --fixed-strings \
            'include includes/wordpress-cache-by-tag.conf;' \
            build/ci-cache/sites/sample_wp.conf

      - name: Test nginx configuration
        run: |
          docker run --rm \
            --env EXPECTED_NGINX_VERSION="${{ matrix.version }}" \
            --env NGINX_REPOSITORY="${{ matrix.repository }}" \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/build/ci-safe:/profile-safe:ro" \
            --volume "$PWD/build/ci-cache:/profile-cache:ro" \
            --volume "$PWD/build/ci-safe/quic_host.key:/etc/nginx/quic_host.key:ro" \
            rockylinux:9 \
            /bin/bash -euxo pipefail -c '
              printf "%s\n" \
                "[nginx]" \
                "name=nginx ${{ matrix.channel }} repository" \
                "baseurl=https://nginx.org/${NGINX_REPOSITORY}/centos/\$releasever/\$basearch/" \
                "gpgcheck=1" \
                "enabled=1" \
                "gpgkey=https://nginx.org/keys/nginx_signing.key" \
                "module_hotfixes=true" \
                > /etc/yum.repos.d/nginx.repo
              nginx_package="nginx-${EXPECTED_NGINX_VERSION}"
              if [ "${EXPECTED_NGINX_VERSION}" = latest ]; then
                nginx_package=nginx
              fi
              dnf install --assumeyes \
                ca-certificates \
                curl-minimal \
                "${nginx_package}" \
                openssl
              openssl version
              nginx -v
              if [ "${EXPECTED_NGINX_VERSION}" != latest ]; then
                nginx -v 2>&1 |
                  grep --fixed-strings "nginx/${EXPECTED_NGINX_VERSION}"
              fi
              /workspace/deploy/install-nginx --verify-host
              for nginx_prefix in /tmp/nginx-safe /tmp/nginx-cache; do
                mkdir -p \
                  "${nginx_prefix}/includes" \
                  "${nginx_prefix}/sites" \
                  "${nginx_prefix}/stubs/http" \
                  "${nginx_prefix}/upstreams" \
                  "${nginx_prefix}/trusted-proxies"
              done
              mkdir -p \
                /var/lib/nginx/client_tmp \
                /var/lib/nginx/fastcgi \
                /var/lib/nginx/fastcgi_tmp \
                /var/lib/nginx/proxy_tmp \
                /run/nginx \
                /run/lock/nginx \
                /var/www/letsencrypt
              install -d -m 0700 /etc/letsencrypt/live/example.com
              (
                umask 077
                openssl req \
                  -x509 \
                  -newkey rsa:2048 \
                  -nodes \
                  -sha256 \
                  -days 1 \
                  -subj "/CN=example.com" \
                  -addext "subjectAltName=DNS:example.com,DNS:www.example.com" \
                  -keyout /etc/letsencrypt/live/example.com/privkey.pem \
                  -out /etc/letsencrypt/live/example.com/fullchain.pem
              )
              cp -R /profile-safe/. /tmp/nginx-safe/
              cp /etc/nginx/mime.types /etc/nginx/fastcgi_params /tmp/nginx-safe/
              grep --fixed-strings \
                "include includes/wordpress-by-tag.conf;" \
                /tmp/nginx-safe/sites/sample_wp.conf
              nginx -t -p /tmp/nginx-safe/ -c nginx.conf
              /workspace/tests/nginx-runtime /tmp/nginx-safe

              cp -R /profile-cache/. /tmp/nginx-cache/
              cp /etc/nginx/mime.types /etc/nginx/fastcgi_params /tmp/nginx-cache/
              grep --fixed-strings \
                "include includes/wordpress-cache-by-tag.conf;" \
                /tmp/nginx-cache/sites/sample_wp.conf
              nginx -t -p /tmp/nginx-cache/ -c nginx.conf
            '

  systemd:
    name: Units on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify unit files
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              /workspace/certbot/install --plan |
                grep --fixed-strings "backend: native"
              /workspace/certbot/install --plan --backend snap |
                grep --fixed-strings "backend: snap"
              /workspace/terminal/install
              dnf install --assumeyes logrotate python3 shadow-utils systemd
              /workspace/deploy/setup-host \
                --plan \
                --profile edge-direct \
                --environment TEST \
                --ssh-phase prepare \
                --authorized-key-ready \
                --ignore-ip 192.0.2.0/24 \
                > /tmp/edge-direct.plan
              grep --fixed-strings \
                "Host setup: profile=edge-direct, environment=TEST, topology=direct, ssh-phase=prepare" \
                /tmp/edge-direct.plan
              grep --fixed-strings \
                "Fail2ban setup: topology=direct, ssh-phase=prepare" \
                /tmp/edge-direct.plan
              /workspace/deploy/setup-host \
                --plan \
                --profile edge-proxied \
                --environment PROD \
                --ssh-phase none \
                --ignore-ip 2001:db8::/32 \
                --certbot-backend snap \
                > /tmp/edge-proxied.plan
              grep --fixed-strings \
                "Host setup: profile=edge-proxied, environment=PROD, topology=proxied, ssh-phase=none" \
                /tmp/edge-proxied.plan
              grep --fixed-strings \
                "Fail2ban setup: topology=proxied, ssh-phase=final" \
                /tmp/edge-proxied.plan
              if grep --fixed-strings "zones/public.xml" /tmp/edge-direct.plan; then
                echo "Host setup must never install the reference zone." >&2
                exit 1
              fi
              install -D -m 0755 /usr/bin/true /usr/sbin/nginx
              install -D -m 0755 /usr/bin/true /sbin/php-fpm
              install -D -m 0755 /usr/bin/true /bin/certbot
              install -D -m 0755 \
                /workspace/deploy/certbot-healthcheck \
                /usr/local/bin/certbot-healthcheck
              getent group nginx >/dev/null || groupadd --system nginx
              id nginx >/dev/null 2>&1 ||
                useradd --system --gid nginx --no-create-home nginx
              id sample_wp >/dev/null 2>&1 ||
                useradd --system --user-group --no-create-home sample_wp
              install -d -o sample_wp -g sample_wp -m 0700 \
                /var/www/sample_wp/var
              install -m 0644 /workspace/systemd/system/php-fpm@.service \
                /etc/systemd/system/php-fpm@.service
              install -D -m 0644 \
                /workspace/systemd/system/php-fpm@sample_wp.service.d/writable-paths.conf \
                /etc/systemd/system/php-fpm@sample_wp.service.d/writable-paths.conf
              install -D -m 0644 \
                /workspace/systemd/system/nginx.service \
                /etc/systemd/system/nginx.service
              install -D -m 0644 \
                /workspace/systemd/system/certbot.service \
                /etc/systemd/system/certbot.service
              install -D -m 0644 \
                /workspace/systemd/system/certbot.timer \
                /etc/systemd/system/certbot.timer
              install -D -m 0644 \
                /workspace/systemd/system/certbot-healthcheck.service \
                /etc/systemd/system/certbot-healthcheck.service
              install -D -m 0644 \
                /workspace/systemd/system/certbot-healthcheck.timer \
                /etc/systemd/system/certbot-healthcheck.timer
              systemd-analyze --version
              # The container uses executable shims for services that are not
              # installed, so their Documentation= man pages are absent.
              systemd-analyze --man=no verify \
                nginx.service \
                certbot.service \
                certbot.timer \
                certbot-healthcheck.service \
                certbot-healthcheck.timer \
                php-fpm@sample_wp.service

              # Compose the optional Snap backend against a representative
              # snapd-generated base service. Drop-ins cannot be verified in
              # isolation, and running snapd inside this container would test
              # the container rather than the unit contract.
              install -D -m 0755 /usr/bin/true /usr/bin/snap
              install -D -m 0644 \
                /workspace/systemd/system/certbot.timer.d/10-snap-runner.conf \
                /etc/systemd/system/certbot.timer.d/10-snap-runner.conf
              install -D -m 0644 \
                /workspace/systemd/system/snap.certbot.renew.service.d/10-nginx.conf \
                /etc/systemd/system/snap.certbot.renew.service.d/10-nginx.conf
              printf "%s\n" \
                "[Unit]" \
                "Description=Representative snap-managed Certbot renewal service" \
                "Wants=network.target" \
                "After=network.target" \
                "" \
                "[Service]" \
                "Type=oneshot" \
                "ExecStart=/usr/bin/snap run --timer=00:00~24:00/2 certbot.renew" \
                > /etc/systemd/system/snap.certbot.renew.service
              # The native payload must be absent here so an ignored or
              # missing Snap target cannot fall back to certbot.service.
              mv \
                /etc/systemd/system/certbot.service \
                /tmp/certbot.service.native
              snap_verify_output=/tmp/systemd-snap-verify.log
              if ! systemd-analyze --man=no verify \
                certbot.timer \
                snap.certbot.renew.service \
                certbot-healthcheck.service \
                certbot-healthcheck.timer \
                nginx.service \
                > "${snap_verify_output}" 2>&1; then
                cat "${snap_verify_output}" >&2
                exit 1
              fi
              # Rocky systemd 252 reports its own packaged aliases while
              # scanning the unit path. Remove only the exact reviewed
              # source/target pairs; every other diagnostic remains fatal.
              known_alias_notices=/tmp/systemd-known-alias-notices
              printf "%s\n" \
                "Suspicious symlink /etc/systemd/system/ctrl-alt-del.target → /usr/lib/systemd/system/reboot.target, treating as alias." \
                "Suspicious symlink /etc/systemd/system/dbus.service → /usr/lib/systemd/system/dbus-broker.service, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/default.target → /usr/lib/systemd/system/graphical.target, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/runlevel0.target → /usr/lib/systemd/system/poweroff.target, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/runlevel1.target → /usr/lib/systemd/system/rescue.target, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/runlevel2.target → /usr/lib/systemd/system/multi-user.target, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/runlevel3.target → /usr/lib/systemd/system/multi-user.target, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/runlevel4.target → /usr/lib/systemd/system/multi-user.target, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/runlevel5.target → /usr/lib/systemd/system/graphical.target, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/runlevel6.target → /usr/lib/systemd/system/reboot.target, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/autovt@.service → /usr/lib/systemd/system/getty@.service, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/dbus-org.freedesktop.locale1.service → /usr/lib/systemd/system/systemd-localed.service, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/dbus-org.freedesktop.timedate1.service → /usr/lib/systemd/system/systemd-timedated.service, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/dbus-org.freedesktop.login1.service → /usr/lib/systemd/system/systemd-logind.service, treating as alias." \
                "Suspicious symlink /usr/lib/systemd/system/dbus-org.freedesktop.hostname1.service → /usr/lib/systemd/system/systemd-hostnamed.service, treating as alias." \
                > "${known_alias_notices}"
              grep --invert-match --fixed-strings --line-regexp \
                --file="${known_alias_notices}" \
                "${snap_verify_output}" \
                > "${snap_verify_output}.filtered" || [ "$?" -eq 1 ]
              mv "${snap_verify_output}.filtered" "${snap_verify_output}"
              if [ -s "${snap_verify_output}" ]; then
                cat "${snap_verify_output}" >&2
                echo "Snap Certbot unit composition emitted diagnostics." >&2
                exit 1
              fi

              snap_timer_dropin=/workspace/systemd/system/certbot.timer.d/10-snap-runner.conf
              snap_service_dropin=/workspace/systemd/system/snap.certbot.renew.service.d/10-nginx.conf
              for timer_contract in \
                "OnCalendar=*-*-* 00,12:00:00" \
                "RandomizedDelaySec=6h" \
                "Persistent=true"; do
                grep --fixed-strings --line-regexp \
                  "${timer_contract}" \
                  /workspace/systemd/system/certbot.timer
              done
              for health_timer_contract in \
                "OnCalendar=*-*-* 03:00:00" \
                "RandomizedDelaySec=2h" \
                "Persistent=true"; do
                grep --fixed-strings --line-regexp \
                  "${health_timer_contract}" \
                  /workspace/systemd/system/certbot-healthcheck.timer
              done
              for health_service_contract in \
                "ExecStart=/usr/local/bin/certbot-healthcheck --warn-days 30" \
                "PrivateNetwork=yes" \
                "ProtectSystem=strict"; do
                grep --fixed-strings --line-regexp \
                  "${health_service_contract}" \
                  /workspace/systemd/system/certbot-healthcheck.service
              done
              if grep --extended-regexp --quiet \
                "^[[:space:]]*Unit=" \
                /workspace/systemd/system/certbot.timer; then
                echo "Base Certbot timer must retain its name-derived payload." >&2
                exit 1
              fi
              snap_timer_directives=$(sed -n \
                "/^[[:space:]]*[A-Za-z][A-Za-z0-9]*=/s/^[[:space:]]*//p" \
                "${snap_timer_dropin}")
              if [ "${snap_timer_directives}" != \
                "Unit=snap.certbot.renew.service" ]; then
                echo "Snap timer drop-in must change only the renewal payload." >&2
                exit 1
              fi
              for certbot_contract in \
                "Requires=nginx.service" \
                "Wants=network-online.target" \
                "After=network-online.target nginx.service" \
                "UMask=0077" \
                "TimeoutStartSec=1h" \
                "ExecStopPost=/bin/systemctl reload nginx.service"; do
                grep --fixed-strings --line-regexp \
                  "${certbot_contract}" \
                  /workspace/systemd/system/certbot.service
                grep --fixed-strings --line-regexp \
                  "${certbot_contract}" \
                  "${snap_service_dropin}"
              done
              for snap_owned_directive in \
                CapabilityBoundingSet \
                ConfigurationDirectory \
                Environment \
                ExecStart \
                LockPersonality \
                LogsDirectory \
                MemoryDenyWriteExecute \
                NoNewPrivileges \
                PrivateDevices \
                PrivateTmp \
                ProtectClock \
                ProtectControlGroups \
                ProtectHome \
                ProtectHostname \
                ProtectKernelLogs \
                ProtectKernelModules \
                ProtectKernelTunables \
                ProtectProc \
                ProtectSystem \
                ReadWritePaths \
                RestrictAddressFamilies \
                RestrictNamespaces \
                RestrictRealtime \
                RestrictSUIDSGID \
                SocketBindDeny \
                StateDirectory \
                SystemCallArchitectures \
                SystemCallFilter \
                TasksMax; do
                if grep --extended-regexp --quiet \
                  "^${snap_owned_directive}=" \
                  "${snap_service_dropin}"; then
                  echo "Snap Certbot drop-in must not set ${snap_owned_directive}." >&2
                  exit 1
                fi
              done
              install -D -o root -g root -m 0644 \
                /workspace/logrotate/nginx \
                /etc/logrotate.d/nginx
              logrotate --debug /etc/logrotate.d/nginx
            '

  php-fpm:
    name: PHP-FPM sample on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the public PHP-FPM configuration and socket ACL
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              if grep --quiet "release 9" /etc/redhat-release; then
                dnf module install --assumeyes php:8.3/common
              else
                dnf install --assumeyes php-fpm
              fi
              dnf install --assumeyes \
                acl \
                php-cli \
                php-opcache \
                shadow-utils \
                util-linux
              getent group nginx >/dev/null || groupadd --system nginx
              id nginx >/dev/null 2>&1 ||
                useradd --system --gid nginx --no-create-home nginx
              id sample_wp >/dev/null 2>&1 ||
                useradd --system --user-group --no-create-home sample_wp
              install -D -m 0644 /workspace/php-fpm/sites/sample_wp.conf \
                /etc/php-fpm.d/sites/sample_wp.conf
              install -D -m 0644 /workspace/php-fpm/pool/sample_wp.conf \
                /etc/php-fpm.d/pool/sample_wp.conf
              install -d -o sample_wp -g sample_wp -m 0711 /run/sample_wp
              install -d -o sample_wp -g sample_wp -m 0700 \
                /var/lib/php/session/sample_wp \
                /var/www/sample_wp/var/tmp
              # Docker attaches stderr to a root-owned pipe. Give non-root FPM
              # a writable target it can reopen through /proc/self/fd/2.
              php_fpm_stderr=/tmp/php-fpm-sample.log
              install -o sample_wp -g sample_wp -m 0600 \
                /dev/null "${php_fpm_stderr}"
              /sbin/php-fpm --version |
                grep --extended-regexp "^PHP (8\.[3-9]|9\.)"
              php -r "exit(extension_loaded(\"Zend OPcache\") ? 0 : 1);"
              runuser --user sample_wp -- \
                /sbin/php-fpm --test \
                  --fpm-config /etc/php-fpm.d/sites/sample_wp.conf \
                  2>>"${php_fpm_stderr}"

              fpm_pid=
              cleanup_fpm() {
                if [ -n "${fpm_pid}" ] && kill -0 "${fpm_pid}" 2>/dev/null; then
                  kill -QUIT "${fpm_pid}"
                  wait "${fpm_pid}" || true
                fi
              }
              trap cleanup_fpm EXIT

              sample_uid=$(id -u sample_wp)
              sample_gid=$(id -g sample_wp)
              setpriv \
                --reuid="${sample_uid}" \
                --regid="${sample_gid}" \
                --init-groups \
                /sbin/php-fpm \
                  --nodaemonize \
                  --force-stderr \
                  --fpm-config /etc/php-fpm.d/sites/sample_wp.conf \
                  2>>"${php_fpm_stderr}" &
              fpm_pid=$!

              for attempt in {1..50}; do
                if [ -S /run/sample_wp/php-fpm.sock ]; then
                  break
                fi
                if ! kill -0 "${fpm_pid}" 2>/dev/null; then
                  wait "${fpm_pid}"
                  exit 1
                fi
                sleep 0.1
              done

              test -S /run/sample_wp/php-fpm.sock
              getfacl --absolute-names /run/sample_wp/php-fpm.sock |
                grep --fixed-strings "user:nginx:rw-"
              runuser --user nginx -- test -r /run/sample_wp/php-fpm.sock
              runuser --user nginx -- test -w /run/sample_wp/php-fpm.sock

              kill -QUIT "${fpm_pid}"
              wait "${fpm_pid}"
              fpm_pid=
              cat "${php_fpm_stderr}"
              trap - EXIT
              test ! -S /run/sample_wp/php-fpm.sock
            '

  ssh:
    name: sshd drop-ins on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify effective sshd configuration
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              dnf install --assumeyes openssh-server
              grep -q "^Include /etc/ssh/sshd_config.d/\*.conf" /etc/ssh/sshd_config
              /workspace/ssh/install --plan
              /workspace/ssh/setup \
                --plan \
                --phase prepare \
                --authorized-key-ready
              install -m 0644 /workspace/ssh/sshd_config.d/*.conf /etc/ssh/sshd_config.d/
              install -m 0644 \
                /workspace/ssh/transitions/10-baseline-transition-port.conf \
                /etc/ssh/sshd_config.d/10-baseline-transition-port.conf
              ssh-keygen -A
              /usr/sbin/sshd -t
              /usr/sbin/sshd -T | grep -x "port 22"
              /usr/sbin/sshd -T | grep -x "port 2356"
              test "$(/usr/sbin/sshd -T | grep -c "^port ")" = 2
              rm /etc/ssh/sshd_config.d/10-baseline-transition-port.conf
              /usr/sbin/sshd -t
              test "$(/usr/sbin/sshd -T | grep -c "^port ")" = 1
              /usr/sbin/sshd -T | grep -x "port 2356"
              /usr/sbin/sshd -T | grep -x "permitrootlogin no"
              /usr/sbin/sshd -T | grep -x "passwordauthentication no"
              /usr/sbin/sshd -T | grep -x "kbdinteractiveauthentication no"
            '

  firewalld:
    name: firewalld config on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate services and zone
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              dnf install --assumeyes firewalld
              /workspace/firewalld/install --plan
              /workspace/firewalld/setup \
                --plan \
                --service nginx \
                --service ssh-hardened \
                > /tmp/firewalld-setup.plan
              if grep --fixed-strings "zones/public.xml" /tmp/firewalld-setup.plan; then
                echo "firewalld setup must not install the reference zone." >&2
                exit 1
              fi
              install -m 0644 /workspace/firewalld/services/*.xml /etc/firewalld/services/
              install -m 0644 /workspace/firewalld/zones/*.xml /etc/firewalld/zones/
              firewall-offline-cmd --check-config
              firewall-offline-cmd --info-service=nginx
              firewall-offline-cmd --info-service=ssh-hardened
              firewall-offline-cmd --zone=public --list-services |
                grep -w nginx
              firewall-offline-cmd --zone=public --list-services |
                grep -w ssh-hardened
            '

  fail2ban:
    name: Fail2ban policy on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and validate rendered policy
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              /workspace/fail2ban/install
              /workspace/fail2ban/setup \
                --output /tmp/fail2ban-direct \
                --topology direct \
                --ssh-phase prepare \
                --ignore-ip 192.0.2.0/24
              install -d -m 0755 /var/log/nginx
              install -m 0644 /dev/null /var/log/nginx/access.log
              install -m 0644 /dev/null /var/log/nginx/error.log
              install -m 0644 \
                /tmp/fail2ban-direct/etc/fail2ban/jail.local \
                /etc/fail2ban/jail.local
              install -m 0644 \
                /tmp/fail2ban-direct/etc/fail2ban/filter.d/nginx-444.conf \
                /etc/fail2ban/filter.d/nginx-444.conf
              install -m 0644 \
                /tmp/fail2ban-direct/etc/fail2ban/jail.d/90-baseline.local \
                /etc/fail2ban/jail.d/90-baseline.local
              fail2ban-client -t

              /workspace/fail2ban/setup \
                --output /tmp/fail2ban-proxied \
                --topology proxied \
                --ssh-phase final \
                --ignore-ip 2001:db8::/32
              test "$(grep -c "^enabled = true$" \
                /tmp/fail2ban-proxied/etc/fail2ban/jail.d/90-baseline.local)" = 1
              test "$(grep -c "^enabled = false$" \
                /tmp/fail2ban-proxied/etc/fail2ban/jail.d/90-baseline.local)" = 3
            '

  selinux:
    name: SELinux assets on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            target: Rocky Linux 9
          - image: quay.io/centos/centos:stream10
            target: CentOS Stream 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build policy module and inspect port labels
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "${{ matrix.image }}" \
            /bin/bash -euxo pipefail -c '
              dnf install --assumeyes \
                checkpolicy \
                policycoreutils \
                policycoreutils-python-utils \
                selinux-policy-targeted
              /workspace/selinux/install --plan
              /workspace/selinux/setup \
                --plan \
                --component nginx \
                --component ssh \
                --quic-bpf
              for path_specification in \
                "/run/nginx(/.*)?" \
                "/var/run/nginx(/.*)?" \
                "/run/lock/nginx(/.*)?" \
                "/var/lock/nginx(/.*)?"
              do
                grep --fixed-strings "$path_specification" \
                  /workspace/selinux/apply-nginx-policy
              done
              grep --fixed-strings \
                "remove_file_context_if_present '\''/var/run/lock/nginx(/.*)?'\''" \
                /workspace/selinux/apply-nginx-policy
              semanage fcontext --add --type httpd_var_run_t \
                "/run/nginx(/.*)?" 2>/dev/null || \
                semanage fcontext --add --type httpd_var_run_t \
                  "/var/run/nginx(/.*)?"
              semanage fcontext --add --type httpd_var_run_t \
                "/run/lock/nginx(/.*)?" 2>/dev/null || \
                semanage fcontext --add --type httpd_var_run_t \
                  "/var/lock/nginx(/.*)?"
              mkdir -p /run/nginx /run/lock/nginx
              matchpathcon /run/nginx | grep --fixed-strings httpd_var_run_t
              matchpathcon /run/lock/nginx | grep --fixed-strings httpd_var_run_t
              checkmodule -M -m \
                -o /tmp/nginx_quic_bpf.mod \
                /workspace/selinux/nginx_quic_bpf.te
              semodule_package \
                -o /tmp/nginx_quic_bpf.pp \
                -m /tmp/nginx_quic_bpf.mod
              # Informational: shows whether this policy release already
              # labels UDP 443; apply-nginx-policy handles either state.
              semanage port -l | grep ^http_port_t
            '

  secrets:
    name: Public secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
